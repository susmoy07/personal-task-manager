<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>Personal Task Manager</title>
  <meta name="description" content="A simple, elegant personal task manager with priorities, due dates, and dark mode. Built with plain HTML, CSS, and JavaScript." />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       APP SHELL
  ============================================================ -->
  <div class="app-wrapper">

    <!-- ── Header ──────────────────────────────────────────── -->
    <header class="app-header">
      <div class="header-brand">
        <!-- SVG check-circle icon -->
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <h1 class="brand-title">Task Manager</h1>
      </div>

      <!-- Dark-mode toggle button -->
      <button id="dark-mode-toggle"
              class="icon-btn"
              title="Toggle dark mode"
              aria-label="Toggle dark mode">
        <!-- Moon icon (shown in light mode) -->
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- Sun icon (shown in dark mode) -->
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1"  x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22"  x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3"  y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </header>

    <!-- ── Task Input Card ──────────────────────────────────── -->
    <section class="input-card" aria-label="Add a new task">
      <h2 class="card-title">Add New Task</h2>

      <!-- Task title -->
      <div class="form-row">
        <label for="task-input" class="form-label">Task</label>
        <input
          id="task-input"
          type="text"
          class="form-control"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="120"
        />
      </div>

      <!-- Priority + Due date row -->
      <div class="form-row form-row--inline">

        <!-- Priority dropdown -->
        <div class="form-group">
          <label for="priority-select" class="form-label">Priority</label>
          <select id="priority-select" class="form-control form-control--select">
            <option value="low">🟢 Low</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="high">🔴 High</option>
          </select>
        </div>

        <!-- Due date picker -->
        <div class="form-group">
          <label for="due-date" class="form-label">Due Date</label>
          <input
            id="due-date"
            type="date"
            class="form-control"
          />
        </div>

      </div>

      <!-- Submit button -->
      <button id="add-task-btn" class="btn btn--primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" class="btn-icon">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Task
      </button>
    </section>

    <!-- ── Filters + Stats Bar ──────────────────────────────── -->
    <div class="toolbar">
      <!-- Filter tabs -->
      <div class="filter-tabs" role="tablist" aria-label="Task filters">
        <button class="filter-tab active" data-filter="all"       role="tab" aria-selected="true">All</button>
        <button class="filter-tab"        data-filter="pending"   role="tab" aria-selected="false">Pending</button>
        <button class="filter-tab"        data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>

      <!-- Task count badge -->
      <span class="task-count" id="task-count" aria-live="polite">0 tasks</span>
    </div>

    <!-- ── Task List ─────────────────────────────────────────── -->
    <main>
      <!-- Empty-state illustration (shown when no tasks) -->
      <div class="empty-state" id="empty-state" aria-live="polite">
        <svg viewBox="0 0 80 80" fill="none" aria-hidden="true" class="empty-icon">
          <circle cx="40" cy="40" r="38" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
          <path d="M26 40h28M40 26v28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <p>No tasks yet — add one above!</p>
      </div>

      <!-- The actual task list -->
      <ul class="task-list" id="task-list" aria-label="Task list"></ul>
    </main>

    <!-- ── Footer ───────────────────────────────────────────── -->
    <footer class="app-footer">
      Tasks sorted by soonest due date &bull; Data saved in localStorage
    </footer>

  </div><!-- /.app-wrapper -->

  <script src="script.js"></script>
</body>
</html>
